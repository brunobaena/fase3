# =============================================================================
# MANIFESTO KUBERNETES — analytics-service  (com ESO)
# Repositório: brunobaena/fase2-analytics-service
# Cluster EKS: fase2-eks  |  Região: us-east-2  |  Account: 997739472885
# =============================================================================

# -----------------------------------------------------------------------------
# 1. NAMESPACE
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: analytics
  labels:
    app.kubernetes.io/part-of: togglemaster
    env: production

---
# -----------------------------------------------------------------------------
# 2. SERVICEACCOUNT com anotação IRSA
#    O EKS injeta automaticamente um token OIDC neste ServiceAccount.
#    O AWS SDK lê o token e assume a role ToggleMaster-Analytics-Role,
#    obtendo permissões para DynamoDB e SQS sem nenhuma chave de acesso.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-service-sa
  namespace: analytics
  labels:
    app: analytics-service
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::997739472885:role/ToggleMaster-Analytics-Role"

---
# -----------------------------------------------------------------------------
# 3. CONFIGMAP — variáveis NÃO-sensíveis
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-service-config
  namespace: analytics
  labels:
    app: analytics-service
data:
  PORT: "8005"
  AWS_REGION: "us-east-2"
  AWS_DYNAMODB_TABLE: "ToggleMasterAnalytics"
  AWS_SQS_URL: "https://sqs.us-east-2.amazonaws.com/997739472885/toogle-master-queue"

---
# -----------------------------------------------------------------------------
# 4. DEPLOYMENT
#    Nenhum Secret necessário — credenciais AWS vêm do IRSA automaticamente.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: analytics
  labels:
    app: analytics-service
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
        version: "1.0.0"
    spec:
      # Vincula o pod ao ServiceAccount com IRSA
      serviceAccountName: analytics-service-sa

      containers:
        - name: analytics-service
          image: 997739472885.dkr.ecr.us-east-2.amazonaws.com/fiap/analytics-service:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8005
              protocol: TCP

          # -----------------------------------------------------------------
          # Variáveis NÃO-sensíveis — ConfigMap
          # -----------------------------------------------------------------
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: analytics-service-config
                  key: PORT
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: analytics-service-config
                  key: AWS_REGION
            - name: AWS_DYNAMODB_TABLE
              valueFrom:
                configMapKeyRef:
                  name: analytics-service-config
                  key: AWS_DYNAMODB_TABLE
            - name: AWS_SQS_URL
              valueFrom:
                configMapKeyRef:
                  name: analytics-service-config
                  key: AWS_SQS_URL

          # -----------------------------------------------------------------
          # Requests e Limits
          # -----------------------------------------------------------------
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # -----------------------------------------------------------------
          # ReadinessProbe — o pod só recebe tráfego quando /health retornar 200
          # -----------------------------------------------------------------
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          # -----------------------------------------------------------------
          # LivenessProbe — reinicia o container se /health parar de responder
          # -----------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3

      restartPolicy: Always

---
# -----------------------------------------------------------------------------
# 5. SERVICE — ClusterIP
# DNS interno: http://analytics-service.analytics.svc.cluster.local:8005
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: analytics
  labels:
    app: analytics-service
spec:
  type: ClusterIP
  selector:
    app: analytics-service
  ports:
    - name: http
      protocol: TCP
      port: 8005
      targetPort: 8005

---
# -----------------------------------------------------------------------------
# 6. INGRESS
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: analytics-service-ingress
  namespace: analytics
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: "/$2"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /analytics(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: analytics-service
                port:
                  number: 8005

---
# =============================================================================
# 7. KEDA — TriggerAuthentication
# Usa podIdentity AWS (IRSA) com identityOwner: operator
# O KEDA Operator autentica na AWS usando sua própria IRSA Role (KEDA-SQS-Role)
# para consultar o queueDepth da fila SQS sem precisar de credenciais explícitas.
# =============================================================================
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-sqs-trigger-auth
  namespace: analytics
spec:
  podIdentity:
    provider: aws

---
# =============================================================================
# 8. KEDA — ScaledObject
# Monitora a fila SQS "toogle-master-queue" e escala o analytics-service
# de 0 (idle) até 5 réplicas com base no queueDepth.
#
# Lógica de escala:
#   - Nenhuma mensagem na fila  → 0 pods (scale-to-zero)
#   - A cada 5 msgs pendentes   → +1 pod (1 pod/5 mensagens)
#   - Máximo                    → 5 pods
#   - cooldownPeriod            → 300s antes de voltar ao zero
#   - pollingInterval           → verifica a fila a cada 30s
# =============================================================================
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: analytics-sqs-scaledobject
  namespace: analytics
  labels:
    app: analytics-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analytics-service

  # --------------------------------------------------------------------------
  # Réplicas
  # --------------------------------------------------------------------------
  minReplicaCount: 0   # scale-to-zero quando a fila estiver vazia
  maxReplicaCount: 5   # limite superior

  # --------------------------------------------------------------------------
  # Intervalos
  # --------------------------------------------------------------------------
  pollingInterval:  30   # segundos entre cada verificação do queueDepth
  cooldownPeriod:  300   # segundos de fila vazia antes de descer para 0

  # --------------------------------------------------------------------------
  # Trigger — AWS SQS
  # --------------------------------------------------------------------------
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-sqs-trigger-auth
      metadata:
        # URL completa da fila (evita ambiguidade de região)
        queueURL: "https://sqs.us-east-2.amazonaws.com/997739472885/toogle-master-queue"
        # Número de mensagens por pod (1 pod para cada 5 msgs na fila)
        queueLength: "5"
        awsRegion: "us-east-2"
        identityOwner: operator
