# =============================================================================
# MANIFESTO KUBERNETES — targeting-service  (com ESO)
# Repositório: brunobaena/fase2-targeting-service
# Cluster EKS: fase2-eks  |  Região: us-east-2  |  Account: 997739472885
# =============================================================================

# -----------------------------------------------------------------------------
# 1. NAMESPACE
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: targeting
  labels:
    app.kubernetes.io/part-of: togglemaster
    env: production

---
# -----------------------------------------------------------------------------
# 2. CONFIGMAP — variáveis NÃO-sensíveis
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: targeting-service-config
  namespace: targeting
  labels:
    app: targeting-service
data:
  PORT: "8003"
  AUTH_SERVICE_URL: "http://auth-service.auth.svc.cluster.local:8001"

---
# -----------------------------------------------------------------------------
# 3. EXTERNAL SECRET
#    O ESO lê os valores do Secrets Manager e cria/atualiza automaticamente
#    o Secret K8s "targeting-service-secret" neste namespace.
#    Nenhum valor sensível fica hardcoded neste arquivo.
# -----------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: targeting-service-external-secret
  namespace: targeting
  labels:
    app: targeting-service
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: togglemaster-aws
    kind: ClusterSecretStore

  target:
    name: targeting-service-secret     # nome do Secret K8s que será criado/gerenciado
    creationPolicy: Owner              # ESO é owner — apaga junto se o ExternalSecret for apagado

    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .rds_username }}:{{ .rds_password | urlquery }}@targeting-db.cz8iwao2givk.us-east-2.rds.amazonaws.com:5432/postgres"

  # Mapeamento entre chaves do Secrets Manager e variáveis no Secret K8s
  data:
    - secretKey: rds_username
      remoteRef:
        key: rds!db-536c722a-1a2e-4c59-9e14-dd6d31e74274
        property: username
    - secretKey: rds_password
      remoteRef:
        key: rds!db-536c722a-1a2e-4c59-9e14-dd6d31e74274
        property: password

---
# -----------------------------------------------------------------------------
# 4. DEPLOYMENT
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: targeting
  labels:
    app: targeting-service
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
        version: "1.0.0"
    spec:

      containers:
        - name: targeting-service
          image: 997739472885.dkr.ecr.us-east-2.amazonaws.com/fiap/targeting-service:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
              protocol: TCP

          # -----------------------------------------------------------------
          # Variáveis NÃO-sensíveis — ConfigMap
          # -----------------------------------------------------------------
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: targeting-service-config
                  key: PORT
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: targeting-service-config
                  key: AUTH_SERVICE_URL

          # -----------------------------------------------------------------
          # Variáveis SENSÍVEIS — Secret gerenciado pelo ESO
          # -----------------------------------------------------------------                    
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: targeting-service-secret
                  key: DATABASE_URL

          # -----------------------------------------------------------------
          # Requests e Limits
          # -----------------------------------------------------------------
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # -----------------------------------------------------------------
          # ReadinessProbe — o pod só recebe tráfego quando /health retornar 200
          # -----------------------------------------------------------------
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          # -----------------------------------------------------------------
          # LivenessProbe — reinicia o container se /health parar de responder
          # -----------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3

      restartPolicy: Always

---
# -----------------------------------------------------------------------------
# 5. SERVICE — ClusterIP
# DNS interno: http://targeting-service.targeting.svc.cluster.local:8003
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  namespace: targeting
  labels:
    app: targeting-service
spec:
  type: ClusterIP
  selector:
    app: targeting-service
  ports:
    - name: http
      protocol: TCP
      port: 8003
      targetPort: 8003

---
# -----------------------------------------------------------------------------
# 6. INGRESS
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: targeting-service-ingress
  namespace: targeting
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: "/$2"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /targeting(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: targeting-service
                port:
                  number: 8003
