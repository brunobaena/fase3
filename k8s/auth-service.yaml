# =============================================================================
# MANIFESTO KUBERNETES — auth-service  (com ESO)
# Repositório: brunobaena/fase2-auth-service
# Cluster EKS: fase2-eks  |  Região: us-east-2  |  Account: 997739472885
# =============================================================================

# -----------------------------------------------------------------------------
# 1. NAMESPACE
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: auth
  labels:
    app.kubernetes.io/part-of: togglemaster
    env: production

---
# -----------------------------------------------------------------------------
# 2. CONFIGMAP — variáveis NÃO-sensíveis
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: auth
  labels:
    app: auth-service
data:
  PORT: "8001"

---
# -----------------------------------------------------------------------------
# 3. EXTERNAL SECRET
#    O ESO lê os valores do Secrets Manager e cria/atualiza automaticamente
#    o Secret K8s "auth-service-secret" neste namespace.
#    Nenhum valor sensível fica hardcoded neste arquivo.
# -----------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service-external-secret
  namespace: auth
  labels:
    app: auth-service
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: togglemaster-aws
    kind: ClusterSecretStore

  target:
    name: auth-service-secret     # nome do Secret K8s que será criado/gerenciado
    creationPolicy: Owner         # ESO é owner — apaga junto se o ExternalSecret for apagado

    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .rds_username }}:{{ .rds_password | urlquery }}@auth-db.cz8iwao2givk.us-east-2.rds.amazonaws.com:5432/postgres"
        MASTER_KEY: "{{ .master_key }}"

  # Mapeamento entre chaves do Secrets Manager e variáveis no Secret K8s
  data:
    - secretKey: rds_username
      remoteRef:
        key: rds!db-ac7b4150-fd80-4179-b574-461102a842f0
        property: username

    - secretKey: rds_password
      remoteRef:
        key: rds!db-ac7b4150-fd80-4179-b574-461102a842f0
        property: password

    - secretKey: master_key
      remoteRef:
        key: togglemaster/auth-service/master-key

---
# -----------------------------------------------------------------------------
# 4. DEPLOYMENT
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: auth
  labels:
    app: auth-service
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        version: "1.0.0"
    spec:

      containers:
        - name: auth-service
          image: 997739472885.dkr.ecr.us-east-2.amazonaws.com/fiap/auth-service:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              protocol: TCP

          # -----------------------------------------------------------------
          # Variáveis NÃO-sensíveis — ConfigMap
          # -----------------------------------------------------------------
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: auth-service-config
                  key: PORT

          # -----------------------------------------------------------------
          # Variáveis SENSÍVEIS — Secret gerenciado pelo ESO
          # -----------------------------------------------------------------
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: DATABASE_URL
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: MASTER_KEY

          # -----------------------------------------------------------------
          # Requests e Limits
          # -----------------------------------------------------------------
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # -----------------------------------------------------------------
          # ReadinessProbe — o pod só recebe tráfego quando /health retornar 200
          # -----------------------------------------------------------------
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          # -----------------------------------------------------------------
          # LivenessProbe — reinicia o container se /health parar de responder
          # -----------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3

      restartPolicy: Always

---
# -----------------------------------------------------------------------------
# 5. SERVICE — ClusterIP
# DNS interno: http://auth-service.auth.svc.cluster.local:8001
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: auth
  labels:
    app: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: 8001

---
# -----------------------------------------------------------------------------
# 6. INGRESS
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-service-ingress
  namespace: auth
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: "/$2"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 8001
