# A tag da imagem e atualizada pelo pipeline (.github/workflows/microservice-ci.yml).
# O Reloader reinicia este Deployment quando o Secret targeting-service-secret muda (rotacao de senha do RDS).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: targeting
  labels:
    app: targeting-service
    version: "1.0.0"
  annotations:
    secret.reloader.stakater.com/reload: "targeting-service-secret"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
        version: "1.0.0"
    spec:
      containers:
        - name: targeting-service
          image: 997739472885.dkr.ecr.us-east-2.amazonaws.com/fiap/targeting-service:sha-90aa102e1912ddce97f3d51a6ba42555a3442dfe
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
              protocol: TCP
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: targeting-service-config
                  key: PORT
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: targeting-service-config
                  key: AUTH_SERVICE_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: targeting-service-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
      restartPolicy: Always
