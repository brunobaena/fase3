# Service ClusterIP. DNS interno: http://targeting-service.targeting.svc.cluster.local:8003
apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  namespace: targeting
  labels:
    app: targeting-service
spec:
  type: ClusterIP
  selector:
    app: targeting-service
  ports:
    - name: http
      protocol: TCP
      port: 8003
      targetPort: 8003
