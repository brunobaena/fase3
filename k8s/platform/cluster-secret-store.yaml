# ClusterSecretStore unico (us-east-2): todos os recursos vivem nesta regiao,
# entao o store us-east-1 foi removido. Usa a IRSA do ESO (ToggleMaster-ESO-Role).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: togglemaster-aws
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
