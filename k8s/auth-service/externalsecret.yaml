# O ESO monta o Secret K8s "auth-service-secret" a partir de dois secrets do AWS Secrets Manager:
#  1) togglemaster/apps/auth-service/db-endpoint (Terraform): host, port, dbname, username. Nome estavel.
#  2) o secret gerenciado pelo RDS ("rds!db-<uuid>", com rotacao automatica): contem a senha.
#     O nome muda a cada recriacao do banco, entao ele e localizado pela tag
#     aws:rds:primaryDBInstanceArn (ARN da instancia, previsivel) e renomeado para "rds".
# Quando o RDS rotaciona a senha, o ESO atualiza o Secret em ate refreshInterval e o Reloader
# reinicia o Deployment (annotation secret.reloader.stakater.com/reload).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service-external-secret
  namespace: auth
  labels:
    app: auth-service
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: togglemaster-aws
    kind: ClusterSecretStore
  target:
    name: auth-service-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "{{ $r := .rds | fromJson }}postgres://{{ $r.username }}:{{ $r.password | urlquery }}@{{ .host }}:{{ .port }}/{{ .dbname }}"
        MASTER_KEY: "{{ .master_key }}"
  data:
    - secretKey: master_key
      remoteRef:
        key: togglemaster/apps/auth-service/master-key
  dataFrom:
    - extract:
        key: togglemaster/apps/auth-service/db-endpoint
    - find:
        tags:
          "aws:rds:primaryDBInstanceArn": "arn:aws:rds:us-east-2:997739472885:db:auth-db"
      rewrite:
        - regexp:
            source: ".+"
            target: "rds"
