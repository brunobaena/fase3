# O ESO le o AWS Secrets Manager e cria o Secret K8s "flags-service-secret" neste namespace.
# Os valores sao gravados pelo Terraform (terraform/modules/databases/secrets.tf):
# nenhum valor sensivel nem endpoint fica no Git, entao sobrevivem a destroy/rebuild.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flags-service-external-secret
  namespace: flags
  labels:
    app: flags-service
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: togglemaster-aws
    kind: ClusterSecretStore
  target:
    name: flags-service-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .username }}:{{ .password | urlquery }}@{{ .host }}:{{ .port }}/{{ .dbname }}"
  dataFrom:
    - extract:
        key: togglemaster/apps/flags-service/db
