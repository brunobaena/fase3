# Service ClusterIP. DNS interno: http://flags-service.flags.svc.cluster.local:8002
apiVersion: v1
kind: Service
metadata:
  name: flags-service
  namespace: flags
  labels:
    app: flags-service
spec:
  type: ClusterIP
  selector:
    app: flags-service
  ports:
    - name: http
      protocol: TCP
      port: 8002
      targetPort: 8002
