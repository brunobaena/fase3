# Valores gravados pelo Terraform (terraform/modules/databases/secrets.tf):
#  - REDIS_URL:  endpoint do ElastiCache (muda a cada rebuild)
#  - MASTER_KEY: chave admin do auth-service, usada so pelo initContainer para
#                emitir a SERVICE_API_KEY (substitui a leitura cross-namespace
#                do Secret do auth via RBAC).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: evaluation-service-external-secret
  namespace: evaluation
  labels:
    app: evaluation-service
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: togglemaster-aws
    kind: ClusterSecretStore
  target:
    name: evaluation-service-secret
    creationPolicy: Owner
  data:
    - secretKey: REDIS_URL
      remoteRef:
        key: togglemaster/apps/evaluation-service/redis-url
    - secretKey: MASTER_KEY
      remoteRef:
        key: togglemaster/apps/auth-service/master-key
