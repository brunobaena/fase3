# Service ClusterIP. DNS interno: http://evaluation-service.evaluation.svc.cluster.local:8004
apiVersion: v1
kind: Service
metadata:
  name: evaluation-service
  namespace: evaluation
  labels:
    app: evaluation-service
spec:
  type: ClusterIP
  selector:
    app: evaluation-service
  ports:
    - name: http
      protocol: TCP
      port: 8004
      targetPort: 8004
