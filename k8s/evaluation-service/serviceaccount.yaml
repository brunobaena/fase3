# IRSA: o EKS injeta um token OIDC e o AWS SDK assume a role ToggleMaster-Evaluation-Role
# (criada em terraform/modules/eks/irsa.tf) com permissao de envio para a fila SQS.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluation-service-sa
  namespace: evaluation
  labels:
    app: evaluation-service
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    eks.amazonaws.com/role-arn: "arn:aws:iam::997739472885:role/ToggleMaster-Evaluation-Role"
