# Service ClusterIP. DNS interno: http://analytics-service.analytics.svc.cluster.local:8005
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: analytics
  labels:
    app: analytics-service
spec:
  type: ClusterIP
  selector:
    app: analytics-service
  ports:
    - name: http
      protocol: TCP
      port: 8005
      targetPort: 8005
