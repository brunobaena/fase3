# IRSA: role ToggleMaster-Analytics-Role (terraform/modules/eks/irsa.tf) com acesso
# ao DynamoDB ToggleMasterAnalytics e a fila SQS. Nenhuma chave de acesso e necessaria.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-service-sa
  namespace: analytics
  labels:
    app: analytics-service
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    eks.amazonaws.com/role-arn: "arn:aws:iam::997739472885:role/ToggleMaster-Analytics-Role"
