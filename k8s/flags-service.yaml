# =============================================================================
# MANIFESTO KUBERNETES — flags-service  (com ESO)
# Repositório: brunobaena/fase2-flags-service
# Cluster EKS: fase2-eks  |  Região: us-east-2  |  Account: 997739472885
# =============================================================================

# -----------------------------------------------------------------------------
# 1. NAMESPACE
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: flags
  labels:
    app.kubernetes.io/part-of: togglemaster
    env: production

---
# -----------------------------------------------------------------------------
# 2. CONFIGMAP — variáveis NÃO-sensíveis
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: flags-service-config
  namespace: flags
  labels:
    app: flags-service
data:
  PORT: "8002"
  AUTH_SERVICE_URL: "http://auth-service.auth.svc.cluster.local:8001/"

---
# -----------------------------------------------------------------------------
# 3. EXTERNAL SECRET
#    O ESO lê os valores do Secrets Manager e cria/atualiza automaticamente
#    o Secret K8s "flags-service-secret" neste namespace.
#    Nenhum valor sensível fica hardcoded neste arquivo.
# -----------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flags-service-external-secret
  namespace: flags
  labels:
    app: flags-service
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: togglemaster-aws-us-east-1
    kind: ClusterSecretStore

  target:
    name: flags-service-secret     # nome do Secret K8s que será criado/gerenciado
    creationPolicy: Owner          # ESO é owner — apaga junto se o ExternalSecret for apagado

    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .rds_username }}:{{ .rds_password | urlquery }}@flags-db.cq50uy62a1zh.us-east-1.rds.amazonaws.com:5432/postgres"

  # Mapeamento entre chaves do Secrets Manager e variáveis no Secret K8s
  data:
    - secretKey: rds_username
      remoteRef:
        key: rds!db-ee872bf8-10dd-4de8-b74a-2a808c65d588
        property: username

    - secretKey: rds_password
      remoteRef:
        key: rds!db-ee872bf8-10dd-4de8-b74a-2a808c65d588
        property: password

---
# -----------------------------------------------------------------------------
# 4. DEPLOYMENT
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flags-service
  namespace: flags
  labels:
    app: flags-service
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flags-service
  template:
    metadata:
      labels:
        app: flags-service
        version: "1.0.0"
    spec:

      containers:
        - name: flags-service
          image: 997739472885.dkr.ecr.us-east-2.amazonaws.com/fiap/flags-service:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
              protocol: TCP

          # -----------------------------------------------------------------
          # Variáveis NÃO-sensíveis — ConfigMap
          # -----------------------------------------------------------------
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: flags-service-config
                  key: PORT
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: flags-service-config
                  key: AUTH_SERVICE_URL

          # -----------------------------------------------------------------
          # Variáveis SENSÍVEIS — Secret gerenciado pelo ESO
          # -----------------------------------------------------------------
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flags-service-secret
                  key: DATABASE_URL

          # -----------------------------------------------------------------
          # Requests e Limits
          # -----------------------------------------------------------------
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # -----------------------------------------------------------------
          # ReadinessProbe — o pod só recebe tráfego quando /health retornar 200
          # -----------------------------------------------------------------
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          # -----------------------------------------------------------------
          # LivenessProbe — reinicia o container se /health parar de responder
          # -----------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3

      restartPolicy: Always

---
# -----------------------------------------------------------------------------
# 5. SERVICE — ClusterIP
# DNS interno: http://flags-service.flags.svc.cluster.local:8002
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: flags-service
  namespace: flags
  labels:
    app: flags-service
spec:
  type: ClusterIP
  selector:
    app: flags-service
  ports:
    - name: http
      protocol: TCP
      port: 8002
      targetPort: 8002

---
# -----------------------------------------------------------------------------
# 6. INGRESS
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flags-service-ingress
  namespace: flags
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: "/$2"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /flags(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: flags-service
                port:
                  number: 8002
