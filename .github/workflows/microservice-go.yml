name: Go Microservice CI

on:
  workflow_call:
    inputs:
      service:
        description: Directory containing the Go microservice.
        required: true
        type: string
      ecr-repository:
        description: ECR repository name for the microservice image.
        required: true
        type: string
      sonar-project-key:
        description: SonarCloud project key for the microservice.
        required: true
        type: string
    secrets:
      AWS_ROLE_ECR_PUSH:
        description: IAM role ARN (push-only to ECR) assumed through OIDC for pushes to main.
        required: false
      SONAR_TOKEN:
        description: SonarCloud token used to publish analysis.
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.service }}/go.mod
          cache-dependency-path: ${{ inputs.service }}/go.mod

      - name: Build Go service
        working-directory: ${{ inputs.service }}
        run: go build -mod=readonly -v ./...

      - name: Run Go unit tests
        working-directory: ${{ inputs.service }}
        run: go test -mod=readonly -v ./...

  lint:
    name: Linter / Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.service }}/go.mod
          cache-dependency-path: ${{ inputs.service }}/go.mod

      - name: Lint Go service
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ${{ inputs.service }}

  security-and-container:
    name: Security & Container Pipeline
    permissions:
      contents: write
      id-token: write
    needs:
      - build-and-test
      - lint
    uses: ./.github/workflows/microservice-ci.yml
    with:
      service: ${{ inputs.service }}
      ecr-repository: ${{ inputs.ecr-repository }}
      sonar-project-key: ${{ inputs.sonar-project-key }}
    secrets:
      AWS_ROLE_ECR_PUSH: ${{ secrets.AWS_ROLE_ECR_PUSH }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
