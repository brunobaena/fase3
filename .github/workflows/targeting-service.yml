name: targeting-service

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  pipeline:
    uses: ./.github/workflows/microservice-python.yml
    with:
      service: targeting-service
      ecr-repository: fiap/targeting-service
      sonar-project-key: brunobaena-targeting-service
    secrets:
      AWS_ROLE_ECR_PUSH: ${{ secrets.AWS_ROLE_ECR_PUSH }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
