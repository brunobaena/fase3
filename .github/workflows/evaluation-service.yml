name: evaluation-service

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  pipeline:
    uses: ./.github/workflows/microservice-go.yml
    with:
      service: evaluation-service
      ecr-repository: fiap/evaluation-service
      sonar-project-key: brunobaena-evaluation-service
    secrets:
      AWS_ROLE_ECR_PUSH: ${{ secrets.AWS_ROLE_ECR_PUSH }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
