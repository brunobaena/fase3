name: Microservice CI

on:
  workflow_call:
    inputs:
      service:
        description: Directory containing the microservice.
        required: true
        type: string
      ecr-repository:
        description: ECR repository name for the microservice image.
        required: true
        type: string
      sonar-project-key:
        description: SonarCloud project key for the microservice.
        required: true
        type: string
      sonar-extra-args:
        description: Additional SonarCloud scanner arguments (e.g. sonar.python.version).
        required: false
        type: string
        default: ''
    secrets:
      AWS_ROLE_ECR_PUSH:
        description: IAM role ARN (push-only to ECR) assumed by GitHub Actions through OIDC for pushes to main.
        required: false
      SONAR_TOKEN:
        description: SonarCloud token used to publish analysis.
        required: true

env:
  AWS_REGION: us-east-2

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run SonarCloud analysis (SAST)
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ inputs.service }}
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ inputs.sonar-project-key }}
            -Dsonar.branch.name=master
            ${{ inputs.sonar-extra-args }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Run Trivy dependency scan (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: "false"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: security-scan
    env:
      LOCAL_IMAGE: ${{ inputs.service }}:${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.service }}
          load: true
          tags: ${{ env.LOCAL_IMAGE }}

      - name: Export image artifact
        run: docker save "$LOCAL_IMAGE" -o /tmp/container-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ inputs.service }}
          path: /tmp/container-image.tar
          retention-days: 1

  docker-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: docker-build
    env:
      LOCAL_IMAGE: ${{ inputs.service }}:${{ github.sha }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ inputs.service }}
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/container-image.tar

      - name: Scan Docker image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: "false"

  ecr-push:
    name: ECR Push & Manifest Update
    runs-on: ubuntu-latest
    needs: docker-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    env:
      IMAGE_TAG: sha-${{ github.sha }}
      LOCAL_IMAGE: ${{ inputs.service }}:${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ inputs.service }}
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/container-image.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ECR_PUSH }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        run: |
          # As tags do ECR sao imutaveis: um re-run do mesmo commit nao pode sobrescrever a tag.
          EXISTING=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'images[0].imageId.imageDigest' --output text)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "None" ]; then
            echo "::notice::Imagem $IMAGE_TAG ja existe no ECR ($EXISTING); push ignorado"
          else
            docker tag "$LOCAL_IMAGE" "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          fi

      - name: Update Kubernetes manifest and push to main
        env:
          MANIFEST: k8s/${{ inputs.service }}/deployment.yaml
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        run: |
          set -euo pipefail

          NEW_TAG="${IMAGE_TAG}"

          # Trabalha em cima da ponta atual da main para evitar sobrescrever
          # commits de outros servicos que sofreram push no mesmo instante.
          git fetch origin main
          git checkout -B "release/${GITHUB_SHA}" origin/main

          # Ignora builds antigos: se o commit em build nao e ancestral da
          # main, ou se o servico ou a configuracao de CI mudou depois dele,
          # um build mais novo ja vai publicar o manifest.
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::notice::Commit ${GITHUB_SHA} nao e ancestral da main; build antigo ignorado"
            exit 0
          fi
          if git log --oneline "${GITHUB_SHA}..origin/main" -- "${{ inputs.service }}" ".github/workflows" | grep -q .; then
            echo "::notice::Ha alteracoes mais novas em ${{ inputs.service }} ou na CI; build antigo ignorado"
            exit 0
          fi

          # Substitui apenas a tag da imagem do Deployment do servico.
          # A regex exige o caminho do ECR do proprio servico, entao imagens
          # de init containers (ex.: alpine:3.20) sao preservadas.
          sed -i -E "s|(image: [^[:space:]]*/${ECR_REPOSITORY}:)[^[:space:]]+|\1${NEW_TAG}|" "${MANIFEST}"

          git add "${MANIFEST}"
          if git diff --cached --quiet; then
            echo "::notice::Manifest ja aponta para ${NEW_TAG}; nada a commitar"
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(${{ inputs.service }}): atualiza imagem para ${NEW_TAG}"

          # Tenta publicar; se outro servico commitar no meio, atualiza e
          # tenta de novo (cada servico altera apenas o proprio arquivo).
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git log --oneline "${GITHUB_SHA}..origin/main" -- "${{ inputs.service }}" ".github/workflows" | grep -q .; then
              echo "::notice::Alteracoes mais novas chegaram durante o push; build antigo ignorado"
              exit 0
            fi
            if git push origin "HEAD:main"; then
              echo "::notice::Manifest atualizado para ${NEW_TAG} em ${MANIFEST}"
              exit 0
            fi
            echo "::warning::Push conflitou (tentativa ${attempt}/5); atualizando a partir da main..."
            git rebase origin/main
          done

          echo "::error::Nao foi possivel publicar o manifest apos 5 tentativas"
          exit 1
