name: Microservice CI

on:
  workflow_call:
    inputs:
      service:
        description: Directory containing the microservice.
        required: true
        type: string
      ecr-repository:
        description: ECR repository name for the microservice image.
        required: true
        type: string
      sonar-project-key:
        description: SonarCloud project key for the microservice.
        required: true
        type: string
      sonar-extra-args:
        description: Additional SonarCloud scanner arguments (e.g. sonar.python.version).
        required: false
        type: string
        default: ''
    secrets:
      AWS_ROLE_ECR_PUSH:
        description: IAM role ARN (push-only to ECR) assumed by GitHub Actions through OIDC for pushes to main.
        required: false
      SONAR_TOKEN:
        description: SonarCloud token used to publish analysis.
        required: true

env:
  AWS_REGION: us-east-2

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run SonarCloud analysis (SAST)
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ inputs.service }}
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ inputs.sonar-project-key }}
            -Dsonar.branch.name=master
            ${{ inputs.sonar-extra-args }}
            -Dsonar.qualitygate.wait=true

      - name: Run Trivy dependency scan (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"

  docker-build-scan-push:
    name: Docker Build, Container Scan & ECR Push
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: sha-${{ github.sha }}
      LOCAL_IMAGE: ${{ inputs.service }}:${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.service }}
          load: true
          tags: ${{ env.LOCAL_IMAGE }}

      - name: Scan Docker image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ECR_PUSH }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        run: |
          docker tag "$LOCAL_IMAGE" "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
