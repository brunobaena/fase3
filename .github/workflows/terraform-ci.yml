name: Terraform CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - 'terraform-bootstrap/**'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  TF_VERSION: "1.10.5"
  BOOTSTRAP_DIR: terraform-bootstrap
  WORKING_DIR: terraform

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  bootstrap:
    name: 🪣 Terraform Bootstrap (S3 Backend)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TERRAFORM }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔎 Verificar se o bucket do backend ja existe
        id: bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="togglemaster-terraform-state-${ACCOUNT_ID}"
          RC=0
          OUT=$(aws s3api head-bucket --bucket "$BUCKET" 2>&1) || RC=$?
          if [ "$RC" -eq 0 ]; then
            echo "Bucket $BUCKET ja existe. Pulando bootstrap."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif echo "$OUT" | grep -qE "404|Not Found|NoSuchBucket"; then
            echo "Bucket $BUCKET nao existe. Bootstrap sera executado."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Falha ao verificar o bucket $BUCKET: $OUT"
            exit 1
          fi

      - name: 🎯 Format Check
        if: steps.bucket.outputs.exists == 'false'
        working-directory: ${{ env.BOOTSTRAP_DIR }}
        run: terraform fmt -check -recursive

      - name: ⚙️ Init
        if: steps.bucket.outputs.exists == 'false'
        working-directory: ${{ env.BOOTSTRAP_DIR }}
        run: terraform init

      - name: ✅ Validate
        if: steps.bucket.outputs.exists == 'false'
        working-directory: ${{ env.BOOTSTRAP_DIR }}
        run: terraform validate

      - name: 📋 Plan
        if: steps.bucket.outputs.exists == 'false'
        working-directory: ${{ env.BOOTSTRAP_DIR }}
        run: terraform plan -out=tfplan

      - name: 🚀 Apply
        if: steps.bucket.outputs.exists == 'false'
        working-directory: ${{ env.BOOTSTRAP_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: 📊 Output
        if: steps.bucket.outputs.exists == 'false'
        working-directory: ${{ env.BOOTSTRAP_DIR }}
        run: terraform output

  terraform:
    name: 🏗️ Terraform Apply (Infraestrutura)
    needs: bootstrap
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_github_org: ${{ github.repository_owner }}
      TF_VAR_github_repo: ${{ github.event.repository.name }}
      TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
      TF_VAR_github_repo_id: ${{ github.repository_id }}
      TF_VAR_eks_admin_principal_arns: ${{ vars.EKS_ADMIN_PRINCIPAL_ARNS || '[]' }}
      TF_VAR_eks_cluster_name: ${{ vars.EKS_CLUSTER_NAME || 'togglemaster-eks' }}
      TF_VAR_terraform_role_arn: ${{ secrets.AWS_ROLE_TERRAFORM }}
      TF_VAR_eks_existing_pipeline_access: 'false'
      TF_VAR_argocd_allowed_cidrs: ${{ vars.ARGOCD_ALLOWED_CIDRS }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TERRAFORM }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🎯 Format Check
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: ⚙️ Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -e
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init -backend-config="bucket=togglemaster-terraform-state-${ACCOUNT_ID}"

      - name: ✅ Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      - name: ✅ Validate Modules
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          for module in modules/*/; do
            echo "📦 Validando $module"
            cd "$module"
            terraform init -backend=false
            terraform validate
            cd - > /dev/null
          done

      # Somente leitura: entradas existentes sao adotadas pelo import declarativo.
      - name: Identificar entrada de acesso EKS existente
        run: |
          set -euo pipefail
          if aws eks describe-access-entry \
            --cluster-name "$TF_VAR_eks_cluster_name" \
            --principal-arn "$TF_VAR_terraform_role_arn" \
            --region "$AWS_REGION" \
            --output json > "$RUNNER_TEMP/eks-pipeline-access.json" 2> "$RUNNER_TEMP/eks-pipeline-access.err"; then
            echo "TF_VAR_eks_existing_pipeline_access=true" >> "$GITHUB_ENV"
          elif grep -q 'ResourceNotFoundException' "$RUNNER_TEMP/eks-pipeline-access.err"; then
            echo "TF_VAR_eks_existing_pipeline_access=false" >> "$GITHUB_ENV"
          else
            cat "$RUNNER_TEMP/eks-pipeline-access.err" >&2
            exit 1
          fi

      - name: 📋 Plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan -out=tfplan \
            -var="github_org=$TF_VAR_github_org" \
            -var="github_repo=$TF_VAR_github_repo" \
            -var="github_owner_id=$TF_VAR_github_owner_id" \
            -var="github_repo_id=$TF_VAR_github_repo_id" \
            -var="eks_cluster_name=$TF_VAR_eks_cluster_name" \
            -var="eks_admin_principal_arns=$TF_VAR_eks_admin_principal_arns" \
            -var="terraform_role_arn=$TF_VAR_terraform_role_arn" \
            -var="eks_existing_pipeline_access=$TF_VAR_eks_existing_pipeline_access"

      - name: 🚀 Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: 📊 Output
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform output

      - name: 🔐 Atualizar secret AWS_ROLE_ECR_PUSH
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          ROLE_ARN=$(terraform output -raw github_actions_role_arn)
          echo "Atualizando secret AWS_ROLE_ECR_PUSH com a role: $ROLE_ARN"
          gh secret set AWS_ROLE_ECR_PUSH --repo "${{ github.repository }}" --body "$ROLE_ARN"
