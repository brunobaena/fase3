name: Terraform CI/CD

on:
  push:
    branches: [ main ]
    paths: [ 'terraform/**', 'terraform-bootstrap/**' ]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  TF_VERSION: "1.10.5"
  BOOTSTRAP_DIR: terraform-bootstrap
  WORKING_DIR: terraform

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  validate-modules:
    name: ✅ Validate Modules
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: ✅ Validate Modules
        run: |
          for module in terraform/modules/*/; do
            echo "📦 Validando $module"
            cd "$module"
            terraform init -backend=false
            terraform validate
            cd - > /dev/null
          done

  bootstrap:
    name: 🪣 Terraform Bootstrap (S3 Backend)
    needs: validate-modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TERRAFORM }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🎯 Format Check
        working-directory: ${{ env.BOOTSTRAP_DIR }}
        run: terraform fmt -check -recursive

      - name: ⚙️ Init
        working-directory: ${{ env.BOOTSTRAP_DIR }}
        run: terraform init

      - name: ✅ Validate
        working-directory: ${{ env.BOOTSTRAP_DIR }}
        run: terraform validate

      - name: 📋 Plan
        working-directory: ${{ env.BOOTSTRAP_DIR }}
        run: terraform plan -out=tfplan

      - name: 🚀 Apply
        working-directory: ${{ env.BOOTSTRAP_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: 📊 Output
        working-directory: ${{ env.BOOTSTRAP_DIR }}
        run: terraform output

  terraform:
    name: 🏗️ Terraform Apply (Infraestrutura)
    needs: bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_github_org: ${{ github.repository_owner }}
      TF_VAR_github_repo: ${{ github.event.repository.name }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TERRAFORM }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🎯 Format Check
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: ⚙️ Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: ✅ Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      - name: 🔎 Importar OIDC Provider existente (se necessario)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -e
          PROVIDER_ARN=$(aws iam list-open-id-connect-providers \
            --query "OpenIDConnectProviderList[?contains(Arn, 'token.actions.githubusercontent.com')].Arn" \
            --output text)

          if [ -n "$PROVIDER_ARN" ] && [ "$PROVIDER_ARN" != "None" ]; then
            echo "OIDC provider ja existe na conta AWS: $PROVIDER_ARN"
            if terraform state list 2>/dev/null | grep -qx 'module.github_actions_oidc.aws_iam_openid_connect_provider.github_actions'; then
              echo "Ja esta presente no state do Terraform, nada a fazer."
            else
              echo "Nao esta no state ainda. Importando..."
              terraform import 'module.github_actions_oidc.aws_iam_openid_connect_provider.github_actions' "$PROVIDER_ARN"
            fi
          else
            echo "OIDC provider ainda nao existe. O Terraform ira cria-lo no apply."
          fi

      - name: 📋 Plan
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -out=tfplan

      - name: 🚀 Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: 📊 Output
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform output

      - name: 🔐 Atualizar secret AWS_ROLE_ECR_PUSH
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          ROLE_ARN=$(terraform output -raw github_actions_role_arn)
          echo "Atualizando secret AWS_ROLE_ECR_PUSH com a role: $ROLE_ARN"
          gh secret set AWS_ROLE_ECR_PUSH --repo "${{ github.repository }}" --body "$ROLE_ARN"
