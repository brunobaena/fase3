name: Terraform CI/CD

on:
  push:
    branches: [ main ]
    paths: [ 'terraform/**', 'terraform-bootstrap/**' ]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  TF_VERSION: "1.10.5"
  BOOTSTRAP_DIR: terraform-bootstrap
  WORKING_DIR: terraform

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  validate-modules:
    name: ✅ Validate Modules
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: ✅ Validate Modules
        run: |
          for module in terraform/modules/*/; do
            echo "📦 Validando $module"
            cd "$module"
            terraform init -backend=false
            terraform validate
            cd - > /dev/null
          done

  bootstrap:
    name: 🪣 Terraform Bootstrap (S3 Backend)
    needs: validate-modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TERRAFORM }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔎 Verificar se o bucket do backend ja existe
        id: bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="togglemaster-terraform-state-${ACCOUNT_ID}"
          RC=0
          OUT=$(aws s3api head-bucket --bucket "$BUCKET" 2>&1) || RC=$?
          if [ "$RC" -eq 0 ]; then
            echo "Bucket $BUCKET ja existe. Pulando bootstrap."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif echo "$OUT" | grep -qE "404|Not Found|NoSuchBucket"; then
            echo "Bucket $BUCKET nao existe. Bootstrap sera executado."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Falha ao verificar o bucket $BUCKET: $OUT"
            exit 1
          fi

      - name: 🎯 Format Check
        working-directory: ${{ env.BOOTSTRAP_DIR }}
        run: terraform fmt -check -recursive

      - name: ⚙️ Init
        if: steps.bucket.outputs.exists == 'false'
        working-directory: ${{ env.BOOTSTRAP_DIR }}
        run: terraform init

      - name: ✅ Validate
        if: steps.bucket.outputs.exists == 'false'
        working-directory: ${{ env.BOOTSTRAP_DIR }}
        run: terraform validate

      - name: 📋 Plan
        if: steps.bucket.outputs.exists == 'false'
        working-directory: ${{ env.BOOTSTRAP_DIR }}
        run: terraform plan -out=tfplan

      - name: 🚀 Apply
        if: steps.bucket.outputs.exists == 'false'
        working-directory: ${{ env.BOOTSTRAP_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: 📊 Output
        if: steps.bucket.outputs.exists == 'false'
        working-directory: ${{ env.BOOTSTRAP_DIR }}
        run: terraform output

  terraform:
    name: 🏗️ Terraform Apply (Infraestrutura)
    needs: bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_github_org: ${{ github.repository_owner }}
      TF_VAR_github_repo: ${{ github.event.repository.name }}
      TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
      TF_VAR_github_repo_id: ${{ github.repository_id }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TERRAFORM }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🎯 Format Check
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: ⚙️ Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -e
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init -backend-config="bucket=togglemaster-terraform-state-${ACCOUNT_ID}"

      - name: ✅ Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      - name: 📋 Plan
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -out=tfplan

      - name: 🚀 Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: 📊 Output
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform output

      - name: 🔐 Atualizar secret AWS_ROLE_ECR_PUSH
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          ROLE_ARN=$(terraform output -raw github_actions_role_arn)
          echo "Atualizando secret AWS_ROLE_ECR_PUSH com a role: $ROLE_ARN"
          gh secret set AWS_ROLE_ECR_PUSH --repo "${{ github.repository }}" --body "$ROLE_ARN"
